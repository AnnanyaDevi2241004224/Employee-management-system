<!DOCTYPE html>
<html>
<head>

<title>Employee Dashboard</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
padding:30px;
}

h1{
text-align:center;
}

.container{
max-width:1000px;
margin:auto;
background:rgb(177, 171, 171);
padding:20px;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
border: 2px solid #1a1a1b;
}

input{
padding:8px;
margin:5px;
}

button{
padding:8px 15px;
background:#1a1a1b;
color:white;
border:none;
cursor:pointer;
border-radius:5px;

}

button:hover{
background:#6f7173;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

table,th,td{
border:1px solid #ddd;
}

th,td{
padding:10px;
text-align:center;
}

th{
background:#323538;
color:white;
}

.notification{
margin-top:10px;
padding:10px;
display:none;
border-radius:5px;
}

.success{
background:#d4edda;
color:#155724;
}

.error{
background:#f8d7da;
color:#721c24;
}

</style>

</head>

<body>

<div class="container">

<h1>Employee Dashboard</h1>

<div id="notification" class="notification"></div>

<h3>Add / Update Employee</h3>

<input id="name" placeholder="Name">
<input id="email" placeholder="Email">
<input id="department" placeholder="Department">
<input id="salary" placeholder="Salary">
<input id="designation" placeholder="Designation">

<br><br>

<button onclick="addEmployee()">Add Employee</button>
<button onclick="updateEmployee()">Update Employee</button>

<h3>Employees</h3>

<table>

<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Department</th>
<th>Salary</th>
<th>Designation</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="employeeTable"></tbody>

</table>

</div>

<script>

const API_URL = "http://localhost:8080/employees";

let editingId = null;

window.onload = loadEmployees;

function showNotification(message,type){

const notification = document.getElementById("notification");

notification.innerText = message;

notification.className = "notification " + type;

notification.style.display = "block";

setTimeout(()=>{
notification.style.display="none";
},3000);

}

function loadEmployees(){

fetch(API_URL)
.then(res=>res.json())
.then(data=>{

const table = document.getElementById("employeeTable");

table.innerHTML="";

data.content.forEach(emp=>{

const row = `
<tr>

<td>${emp.id}</td>
<td>${emp.name}</td>
<td>${emp.email}</td>
<td>${emp.department}</td>
<td>${emp.salary}</td>
<td>${emp.designation}</td>

<td>

<button onclick="editEmployee(${emp.id},
'${emp.name}',
'${emp.email}',
'${emp.department}',
'${emp.salary}',
'${emp.designation}')">Edit</button>

<button onclick="deleteEmployee(${emp.id})">Delete</button>

</td>

</tr>
`;

table.innerHTML += row;

});

});

}

function addEmployee(){

const employee = {

name:document.getElementById("name").value,
email:document.getElementById("email").value,
department:document.getElementById("department").value,
salary:document.getElementById("salary").value,
designation:document.getElementById("designation").value

};

fetch(API_URL,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(employee)

})
.then(res=>{

if(!res.ok){
return res.json().then(err=>{
throw err;
});
}

return res.json();

})
.then(()=>{

showNotification("Employee added successfully","success");

clearForm();

loadEmployees();

})
.catch(err=>{

showNotification("Error: "+JSON.stringify(err.errors),"error");

});

}

function editEmployee(id,name,email,department,salary,designation){

editingId = id;

document.getElementById("name").value = name;
document.getElementById("email").value = email;
document.getElementById("department").value = department;
document.getElementById("salary").value = salary;
document.getElementById("designation").value = designation;

}

function updateEmployee(){

if(editingId == null){

showNotification("Select employee to update","error");

return;

}

const employee = {

name:document.getElementById("name").value,
email:document.getElementById("email").value,
department:document.getElementById("department").value,
salary:document.getElementById("salary").value,
designation:document.getElementById("designation").value

};

fetch(API_URL + "/" + editingId,{

method:"PUT",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(employee)

})
.then(res=>res.json())
.then(()=>{

showNotification("Employee updated successfully","success");

editingId = null;

clearForm();

loadEmployees();

});

}

function deleteEmployee(id){

fetch(API_URL+"/"+id,{
method:"DELETE"
})
.then(()=>{

showNotification("Employee deleted","success");

loadEmployees();

});

}

function clearForm(){

document.getElementById("name").value="";
document.getElementById("email").value="";
document.getElementById("department").value="";
document.getElementById("salary").value="";
document.getElementById("designation").value="";

}

</script>

</body>
</html>
